name: Auto-close issues from others

# Issues are the owner's own to-do list for tracking bugs and fixes.
# Anyone else's issue is politely closed automatically, like pull requests.

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    if: github.event.sender.login != github.repository_owner
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thanks for looking! 💓 HeartRateMonitor is a personal tool, published as-is, and its issues are the owner's own to-do list — so this issue will auto-close. Please fork it and make it your own."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
              state_reason: "not_planned"
            });
